<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Not Found</title>
    <link rel="icon" href="/favicon.ico" sizes="any">

    <link rel="stylesheet" href="/static/css/variables.css" />
    <!-- Compiled ahead of time from tailwind.config.js (see WEBSITE_AUDIT_REPORT.md
         for the rebuild command) instead of the cdn.tailwindcss.com play CDN. -->
    <link rel="stylesheet" href="/static/css/tailwind.min.css" />
    
    

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .float {
            animation: float 6s ease-in-out infinite;
        }

        .float-delayed {
            animation: float 7s ease-in-out infinite 0.7s;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-18px); }
            100% { transform: translateY(0px); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px) scale(.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-card {
            backdrop-filter: blur(18px);
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 45px rgba(0,0,0,0.06);
        }

        .teal-blob {
            background: rgba(20, 184, 166, 0.1); /* var(--color-teal) at 10% opacity */
        }

        .gradient-text-brand {
            background: linear-gradient(90deg, var(--color-navy) 0%, var(--color-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-gradient-brand {
            background: linear-gradient(90deg, var(--color-navy) 0%, var(--color-blue) 100%);
        }
    </style>
</head>

<body>

    <!-- Floating Decorations -->
    <div class="absolute top-10 left-10 w-24 h-24 bg-blue-500/10 rounded-3xl blur-2xl float"></div>
    <div class="absolute bottom-20 right-16 w-32 h-32 teal-blob rounded-3xl blur-2xl float-delayed"></div>

    <div class="min-h-screen flex flex-col justify-center items-center px-6 text-center">

        <!-- Icon -->
        <div class="mb-8 fade-in">
            <div class="w-32 h-32 rounded-3xl bg-white shadow-xl flex items-center justify-center glass-card">
                <i class="fa-solid fa-shop-slash text-6xl text-red-500"></i>
            </div>
        </div>

        <!-- MAIN HEADING -->
        <h1 class="text-4xl md:text-5xl font-extrabold gradient-text-brand fade-in">
            Shop Not Found
        </h1>

        <!-- Subtitle -->
        <p class="text-gray-600 text-lg mt-4 max-w-xl fade-in delay-100">
            The shop you are trying to access doesn’t exist, may be removed, or the subdomain is incorrect.
        </p>

        <!-- Error Card -->
        <div class="glass-card rounded-2xl p-6 mt-8 max-w-md w-full fade-in delay-200">
            <p class="text-sm text-gray-500 font-semibold">Requested Subdomain</p>
            <p class="text-2xl font-bold text-gray-900 mt-1">{{ subdomain }}</p>

            <p class="text-red-600 font-medium mt-4">
                {{ msg }}
            </p>
        </div>

        <!-- Buttons -->
        <div class="mt-10 flex flex-col md:flex-row gap-4 fade-in delay-300">

            <a href="https://avigronix.com"
               class="btn-gradient-brand px-8 py-3 text-lg rounded-xl text-white font-semibold shadow-lg hover:shadow-xl hover:scale-[1.03] transition">
               Go to Home
            </a>


        </div>

        <!-- Footer -->
        <p class="text-gray-500 text-sm mt-10 fade-in delay-400">
            Need help? Contact our support team.
        </p>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"
            integrity="sha512-xgIrH5DRuEOcZK5cPtVXx/WSp5DTir2JNcKE5ahV2u51NCTD9UDxbQgZHYHVBlPc4H8tug6BZTYIl2RdA/X0Vg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>
</body>
</html>
