<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — AVIGRONIX TECHNOLOGIES</title>

    <link rel="icon" href="/static/images/favicon-32x32.png" sizes="32x32" type="image/png"/>
    <link rel="stylesheet" href="/static/css/variables.css" />
    <!-- Compiled ahead of time from tailwind.config.js (see WEBSITE_AUDIT_REPORT.md
         for the rebuild command) instead of the cdn.tailwindcss.com play CDN. -->
    <link rel="stylesheet" href="/static/css/tailwind.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }
        .float { animation: float 6s ease-in-out infinite; }
        .float-delayed { animation: float 7s ease-in-out infinite 0.7s; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-18px); }
            100% { transform: translateY(0px); }
        }
        .fade-in { animation: fadeIn 0.8s ease forwards; opacity: 0; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px) scale(.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .glass-card {
            backdrop-filter: blur(18px);
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 45px rgba(0,0,0,0.06);
        }
        .teal-blob { background: rgba(20, 184, 166, 0.1); }
        .gradient-text-brand {
            background: linear-gradient(90deg, var(--color-navy) 0%, var(--color-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-gradient-brand {
            background: linear-gradient(90deg, var(--color-navy) 0%, var(--color-blue) 100%);
        }
    </style>
</head>
<body>
    <div class="absolute top-10 left-10 w-24 h-24 bg-blue-500/10 rounded-3xl blur-2xl float"></div>
    <div class="absolute bottom-20 right-16 w-32 h-32 teal-blob rounded-3xl blur-2xl float-delayed"></div>

    <div class="min-h-screen flex flex-col justify-center items-center px-6 text-center">
        <div class="mb-8 fade-in">
            <div class="w-32 h-32 rounded-3xl bg-white shadow-xl flex items-center justify-center glass-card">
                <span class="text-5xl font-extrabold gradient-text-brand">404</span>
            </div>
        </div>

        <h1 class="text-4xl md:text-5xl font-extrabold gradient-text-brand fade-in">
            Page Not Found
        </h1>

        <p class="text-gray-600 text-lg mt-4 max-w-xl fade-in">
            The page you're looking for doesn't exist, may have moved, or the link may be broken.
        </p>

        <div class="mt-10 flex flex-col sm:flex-row gap-4 fade-in">
            <a href="/" class="btn-gradient-brand px-8 py-3 text-lg rounded-xl text-white font-semibold shadow-lg hover:shadow-xl hover:scale-[1.03] transition">
                Go to Home
            </a>
            <a href="/contact" class="px-8 py-3 text-lg rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-white transition">
                Contact Us
            </a>
        </div>

        <p class="text-gray-500 text-sm mt-10 fade-in">
            AVIGRONIX TECHNOLOGIES — Software, Web, Mobile &amp; AI Development
        </p>
    </div>
</body>
</html>
